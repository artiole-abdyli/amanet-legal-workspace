# Local development services.
#
# Postgres is the only service that needs a container. Uploaded PDFs are written
# to the local disk through a storage adapter, and outgoing email is recorded in
# the database and shown inside the app, so a reviewer needs nothing but Docker
# and Node to run the project end to end.

services:
  db:
    image: postgres:17-alpine
    container_name: amanet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: amanet
      POSTGRES_PASSWORD: amanet
      POSTGRES_DB: amanet
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amanet -d amanet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
